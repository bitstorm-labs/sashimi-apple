name: Release

on:
  push:
    tags:
      - 'v*'
      # Prerelease tags are handled by deploy.yml — exclude them here
      - '!v*-beta*'
      - '!v*-rc*'

jobs:
  build-release:
    name: Build Release Archive
    # xcode-27 is GitHub's Xcode 27 image (macOS 27, iOS/tvOS 27 SDKs), still a
    # public preview -- see actions/runner-images#14404. macos-15 / macos-26 top
    # out at Xcode 26.x, which cannot compile against iOS 27 APIs.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install tvOS Platform
        run: |
          xcodebuild -downloadPlatform tvOS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Sashimi.xcodeproj \
            -scheme Sashimi \
            -sdk appletvos \
            -archivePath build/Sashimi.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: Sashimi-${{ github.ref_name }}
          path: build/Sashimi.xcarchive
          retention-days: 90
