name: Deploy Mac

# The Mac app: SashimiMobile built for Mac Catalyst, uploaded to TestFlight as
# the macOS platform of the same app. Three ways in:
#   * the Release workflow calls it (workflow_call) -- the normal path;
#   * a hand-pushed mac-vX.Y.Z-betaN tag;
#   * Actions -> Deploy Mac -> Run workflow (dry_run archives, signs and
#     exports the .pkg, but does not upload).
# Signing is Apple cloud-managed via the App Store Connect API key (see the
# `platform :mac` lanes in fastlane/Fastfile): no match certificates/profiles.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
      dry_run:
        description: 'Dry run: build and sign, but do not upload'
        type: boolean
        default: false

  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        type: string
        required: true
      tag:
        description: 'Release tag (mac-vX.Y.Z-betaN); MARKETING_VERSION must match it'
        type: string
        required: true
      notes:
        description: 'TestFlight notes; blank = generated from commits'
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
      environment:
        type: string
        default: 'testflight'

  push:
    tags:
      - 'mac-v*'

permissions:
  contents: read

env:
  # TOOLCHAIN (iOS + Mac, same as deploy-ios.yml): xcode-27 + latest-stable = the newest GA Xcode 27.
  # Never bare 'latest': it picked an Xcode beta and App Store Connect rejected
  # the upload ("Unsupported SDK or Xcode version"). ci.yml's "Build Mac Catalyst App"
  # uses the SAME runner + selector (scripts/check-toolchains.rb enforces it).
  # xcode-27 is GitHub's Xcode 27 image, still a public preview --
  # actions/runner-images#14404.
  XCODE_VERSION: 'latest-stable'

jobs:
  tag-origin:
    # A tag the Release workflow pushed is deployed by that workflow, which
    # calls this one. Its tag message carries "Released-by: Release workflow";
    # the tag-push run sees that and stands down so nothing ships twice.
    # Hand-pushed tags (no such line) deploy as before.
    name: Tag pushed by the Release workflow?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      released_by_workflow: ${{ steps.check.outputs.released_by_workflow }}
    steps:
      - name: Read the tag message
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A failed lookup fails this job, and the deploy then stands down too
          # (re-run it): better than risking a second upload.
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          read -r type sha <<< "$ref"
          message=""
          if [ "$type" = tag ]; then
            message=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .message)
          fi
          if printf '%s\n' "$message" | grep -qx 'Released-by: Release workflow'; then
            echo "released_by_workflow=true" >> "$GITHUB_OUTPUT"
            echo "$TAG was pushed by the Release workflow, which deploys it itself. Nothing to do here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "released_by_workflow=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Mac to ${{ inputs.environment || 'testflight' }}${{ inputs.dry_run && ' (dry run)' || '' }}
    needs: tag-origin
    # Runs for workflow_call / workflow_dispatch (tag-origin skipped) and for
    # hand-pushed tags; stands down for the Release workflow's own tags.
    if: ${{ !cancelled() && needs.tag-origin.result != 'failure' && needs.tag-origin.outputs.released_by_workflow != 'true' }}
    runs-on: xcode-27
    environment: ${{ inputs.environment || 'testflight' }}
    timeout-minutes: 40
    env:
      # Tag being shipped: the Release workflow's, or the pushed/selected tag.
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      RELEASE_NOTES: ${{ inputs.notes }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      LANE: ${{ inputs.environment == 'appstore' && 'release' || 'beta' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0  # tags + history for the TestFlight notes

      - name: Check MARKETING_VERSION matches the tag
        run: scripts/check-version.sh "$RELEASE_TAG"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          # Gemfile.lock resolves excon >= 1.7.1, which requires Ruby >= 3.3.
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install Fastlane
        run: bundle install

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY_CONTENT" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$APP_STORE_CONNECT_KEY_ID".p8

      - name: Deploy to TestFlight${{ inputs.dry_run && ' (dry run, no upload)' || '' }}
        if: env.LANE == 'beta'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane mac beta dry_run:"$DRY_RUN"

      - name: Revoke certificates created on this runner
        if: always()
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane mac revoke_runner_certificates

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sashimi-mac-build
          path: |
            build/*.pkg
            build/ExportOptions-mac.plist
          retention-days: 30
          if-no-files-found: ignore
