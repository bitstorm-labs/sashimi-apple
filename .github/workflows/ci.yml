name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tvOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install tvOS Platform
        run: |
          # Check if tvOS SDK is already available
          if xcodebuild -showsdks | grep -q tvos; then
            echo "tvOS SDK already installed"
          else
            echo "Downloading tvOS platform..."
            for i in 1 2 3; do
              xcodebuild -downloadPlatform tvOS && break
              echo "Retry $i failed, waiting 10s..."
              sleep 10
            done
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies -project Sashimi.xcodeproj -scheme Sashimi

      - name: List Available Destinations
        run: xcodebuild -project Sashimi.xcodeproj -scheme Sashimi -showdestinations | head -30

      - name: Build for tvOS Simulator
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          xcodebuild build \
            -project Sashimi.xcodeproj \
            -scheme Sashimi \
            -destination 'generic/platform=tvOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Build for tvOS Device (Release)
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          xcodebuild build \
            -project Sashimi.xcodeproj \
            -scheme Sashimi \
            -sdk appletvos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Create tvOS Simulator
        # Runner images periodically drop preinstalled runtimes/devices; fetch
        # the runtime and create a device explicitly (download alone creates none).
        run: |
          sudo xcodebuild -downloadPlatform tvOS || xcodebuild -downloadPlatform tvOS
          RUNTIME=$(xcrun simctl list runtimes tvOS | grep -oE 'com.apple.CoreSimulator.SimRuntime.tvOS[-0-9]+' | tail -1)
          echo "Using runtime: $RUNTIME"
          xcrun simctl create "ci-atv" "Apple TV 4K (3rd generation)" "$RUNTIME"

      - name: Run Tests
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          xcodebuild test \
            -project Sashimi.xcodeproj \
            -scheme Sashimi \
            -destination 'platform=tvOS Simulator,name=ci-atv' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies -project Sashimi.xcodeproj -scheme SashimiMobile

      - name: Build for iOS Simulator
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          xcodebuild build \
            -project Sashimi.xcodeproj \
            -scheme SashimiMobile \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Create iOS Simulator
        # Resolve the device type from the runtime's OWN supportedDeviceTypes list
        # rather than from `simctl list devicetypes`. Two traps here:
        #   1. A hardcoded display name ('iPhone 16') breaks when a runner image
        #      renames or drops a preinstalled device -- no code change required.
        #   2. `simctl list devicetypes` is NOT ordered newest-last, so taking the
        #      tail picks an arbitrary device -- in practice iPhone 6s Plus, which
        #      no current iOS runtime supports (SimError 403, "Unable to create a
        #      device for device type").
        # What matters is runtime COMPATIBILITY, not recency: every entry in
        # supportedDeviceTypes can host this runtime, so any iPhone in it works.
        run: |
          RUNTIMES_JSON=$(xcrun simctl list runtimes --json)
          RUNTIME=$(echo "$RUNTIMES_JSON" | jq -r \
            '[.runtimes[] | select(.platform == "iOS" and .isAvailable)]
             | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          if [ -z "$RUNTIME" ]; then
            echo "::error::No available iOS simulator runtime on this runner"
            exit 1
          fi
          DEVICE_TYPE=$(echo "$RUNTIMES_JSON" | jq -r --arg r "$RUNTIME" \
            '.runtimes[] | select(.identifier == $r) | .supportedDeviceTypes
             | map(select(.productFamily == "iPhone")) | last | .identifier // empty')
          if [ -z "$DEVICE_TYPE" ]; then
            echo "::error::Runtime $RUNTIME supports no iPhone device type"
            exit 1
          fi
          echo "Using runtime: $RUNTIME"
          echo "Using device type: $DEVICE_TYPE"
          xcrun simctl create "ci-iphone" "$DEVICE_TYPE" "$RUNTIME"

      - name: Run Tests
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          xcodebuild test \
            -project Sashimi.xcodeproj \
            -scheme SashimiMobile \
            -destination 'platform=iOS Simulator,name=ci-iphone' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

  swiftlint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        env:
          # Pinned deliberately. `brew install swiftlint` installs whatever is
          # current, so an upstream release can fail CI with no code change --
          # which is exactly what happened when 0.65.x reached Homebrew and its
          # new legacy_swiftui_aspect_ratio rule flagged 18 pre-existing files
          # under --strict. Bump this on purpose, with the fixes, not by accident.
          SWIFTLINT_VERSION: "0.63.0"
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -qo /tmp/swiftlint.zip -d /tmp/swiftlint
          /tmp/swiftlint/swiftlint version
          /tmp/swiftlint/swiftlint lint --strict --reporter github-actions-logging
