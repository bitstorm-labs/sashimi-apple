name: CI

# Required checks (branch protection on main): "Build tvOS App" and "SwiftLint".
# Each platform job builds and tests with the SAME runner image + Xcode
# selector its deploy workflow ships with, so green CI means the shipping
# toolchain builds it:
#
#   platform     runner     Xcode selector   deploy workflow
#   tvOS         macos-15   latest-stable    deploy.yml       (Xcode 26.x)
#   iOS          xcode-27   latest-stable    deploy-ios.yml   (newest GA Xcode 27)
#   Mac          xcode-27   latest-stable    deploy-mac.yml   (newest GA Xcode 27)
#
# scripts/check-toolchains.rb (the "Release tooling" job) fails if a pair
# drifts. The Xcode beta only runs in the non-blocking "Forward compat" job.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The merge queue builds the queued merge commit; required checks must run
  # on it or the queue waits forever.
  merge_group:
  # The nightly flaky-test run calls this workflow with tests_only + 2 iterations.
  workflow_call:
    inputs:
      test_iterations:
        description: 'Run each unit test this many times (all must pass)'
        type: number
        default: 1
      tests_only:
        description: 'Skip lint / forward-compat / tooling jobs'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tvOS App
    # TOOLCHAIN (tvOS) = deploy.yml: macos-15 + latest-stable (Xcode 26.x).
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 'latest-stable'

      - name: Install tvOS Platform
        run: |
          # Check if tvOS SDK is already available
          if xcodebuild -showsdks | grep -q tvos; then
            echo "tvOS SDK already installed"
          else
            echo "Downloading tvOS platform..."
            for i in 1 2 3; do
              xcodebuild -downloadPlatform tvOS && break
              echo "Retry $i failed, waiting 10s..."
              sleep 10
            done
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies -project Sashimi.xcodeproj -scheme Sashimi

      - name: List Available Destinations
        run: xcodebuild -project Sashimi.xcodeproj -scheme Sashimi -showdestinations | head -30

      - name: Build for tvOS Simulator
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          xcodebuild build \
            -project Sashimi.xcodeproj \
            -scheme Sashimi \
            -destination 'generic/platform=tvOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Build for tvOS Device (Release)
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          xcodebuild build \
            -project Sashimi.xcodeproj \
            -scheme Sashimi \
            -sdk appletvos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Create tvOS Simulator
        # Runner images periodically drop preinstalled runtimes/devices; fetch
        # the runtime and create a device explicitly (download alone creates none).
        run: |
          sudo xcodebuild -downloadPlatform tvOS || xcodebuild -downloadPlatform tvOS
          RUNTIME=$(xcrun simctl list runtimes tvOS | grep -oE 'com.apple.CoreSimulator.SimRuntime.tvOS[-0-9]+' | tail -1)
          echo "Using runtime: $RUNTIME"
          xcrun simctl create "ci-atv" "Apple TV 4K (3rd generation)" "$RUNTIME"

      - name: Run Tests
        env:
          TEST_ITERATIONS: ${{ inputs.test_iterations || 1 }}
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          # xcodebuild rejects -test-iterations 1, so pass it only for >1
          # (the nightly flaky-test run).
          ITERATIONS=()
          if [ "$TEST_ITERATIONS" -gt 1 ]; then ITERATIONS=(-test-iterations "$TEST_ITERATIONS"); fi
          xcodebuild test \
            -project Sashimi.xcodeproj \
            -scheme Sashimi \
            -destination 'platform=tvOS Simulator,name=ci-atv' \
            "${ITERATIONS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

  build-ios:
    name: Build iOS App
    # TOOLCHAIN (iOS) = deploy-ios.yml: xcode-27 + latest-stable (newest GA
    # Xcode 27). xcode-27 is a public-preview image (actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies -project Sashimi.xcodeproj -scheme SashimiMobile

      - name: Build for iOS Simulator
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          xcodebuild build \
            -project Sashimi.xcodeproj \
            -scheme SashimiMobile \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Create iOS Simulator
        # Resolve the device type from the runtime's OWN supportedDeviceTypes list
        # rather than from `simctl list devicetypes`. Two traps here:
        #   1. A hardcoded display name ('iPhone 16') breaks when a runner image
        #      renames or drops a preinstalled device -- no code change required.
        #   2. `simctl list devicetypes` is NOT ordered newest-last, so taking the
        #      tail picks an arbitrary device -- in practice iPhone 6s Plus, which
        #      no current iOS runtime supports (SimError 403, "Unable to create a
        #      device for device type").
        # What matters is runtime COMPATIBILITY, not recency: every entry in
        # supportedDeviceTypes can host this runtime, so any iPhone in it works.
        run: |
          RUNTIMES_JSON=$(xcrun simctl list runtimes --json)
          RUNTIME=$(echo "$RUNTIMES_JSON" | jq -r \
            '[.runtimes[] | select(.platform == "iOS" and .isAvailable)]
             | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          if [ -z "$RUNTIME" ]; then
            echo "::error::No available iOS simulator runtime on this runner"
            exit 1
          fi
          DEVICE_TYPE=$(echo "$RUNTIMES_JSON" | jq -r --arg r "$RUNTIME" \
            '.runtimes[] | select(.identifier == $r) | .supportedDeviceTypes
             | map(select(.productFamily == "iPhone")) | last | .identifier // empty')
          if [ -z "$DEVICE_TYPE" ]; then
            echo "::error::Runtime $RUNTIME supports no iPhone device type"
            exit 1
          fi
          echo "Using runtime: $RUNTIME"
          echo "Using device type: $DEVICE_TYPE"
          xcrun simctl create "ci-iphone" "$DEVICE_TYPE" "$RUNTIME"

      - name: Run Tests
        env:
          TEST_ITERATIONS: ${{ inputs.test_iterations || 1 }}
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          # xcodebuild rejects -test-iterations 1, so pass it only for >1
          # (the nightly flaky-test run).
          ITERATIONS=()
          if [ "$TEST_ITERATIONS" -gt 1 ]; then ITERATIONS=(-test-iterations "$TEST_ITERATIONS"); fi
          xcodebuild test \
            -project Sashimi.xcodeproj \
            -scheme SashimiMobile \
            -destination 'platform=iOS Simulator,name=ci-iphone' \
            "${ITERATIONS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

  build-mac:
    name: Build Mac Catalyst App
    # TOOLCHAIN (Mac) = deploy-mac.yml: xcode-27 + latest-stable.
    if: ${{ !inputs.tests_only }}
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build for Mac Catalyst (Debug and Release)
        shell: bash # explicit bash enables pipefail so xcodebuild failures aren't masked by xcpretty
        run: |
          for config in Debug Release; do
            xcodebuild build \
              -project Sashimi.xcodeproj \
              -scheme SashimiMobile \
              -destination 'generic/platform=macOS,variant=Mac Catalyst' \
              -configuration "$config" \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty --color
          done

  swiftlint:
    name: SwiftLint
    if: ${{ !inputs.tests_only }}
    # Lints with its own bundled SwiftSyntax; no SDK involved, so it does not
    # need the Xcode 27 image.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run SwiftLint
        env:
          # Pinned deliberately. `brew install swiftlint` installs whatever is
          # current, so an upstream release can fail CI with no code change --
          # which is exactly what happened when 0.65.x reached Homebrew and its
          # new legacy_swiftui_aspect_ratio rule flagged 18 pre-existing files
          # under --strict. Bump this on purpose, with the fixes, not by accident.
          SWIFTLINT_VERSION: "0.63.0"
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -qo /tmp/swiftlint.zip -d /tmp/swiftlint
          /tmp/swiftlint/swiftlint version
          /tmp/swiftlint/swiftlint lint --strict --reporter github-actions-logging

  forward-compat:
    # NOT a required check and never blocks a merge: an early warning that the
    # next Xcode (the beta on the xcode-27 image) breaks the build, before it
    # becomes the shipping toolchain. Build only, no tests; skipped in the
    # merge queue to keep the queue fast.
    name: Forward compat (Xcode beta, non-blocking)
    if: ${{ !inputs.tests_only && github.event_name != 'merge_group' }}
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          # Deliberately the newest Xcode INCLUDING betas. The only job allowed
          # 'latest' (scripts/check-toolchains.rb).
          xcode-version: 'latest'

      - name: Install tvOS Platform
        run: |
          for _ in 1 2 3; do
            xcodebuild -downloadPlatform tvOS && break
            sleep 10
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build tvOS and iOS (Simulator)
        shell: bash
        run: |
          xcodebuild -version
          for target in "Sashimi|generic/platform=tvOS Simulator" "SashimiMobile|generic/platform=iOS Simulator"; do
            xcodebuild build \
              -project Sashimi.xcodeproj \
              -scheme "${target%%|*}" \
              -destination "${target#*|}" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty --color
          done

  release-tooling:
    # Fast Linux checks for the release machinery: the TestFlight notes helper's
    # unit tests and the CI-vs-deploy toolchain pairing.
    name: Release tooling
    if: ${{ !inputs.tests_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'

      - name: TestFlight notes helper tests
        run: ruby scripts/test/release_notes_test.rb

      - name: CI and deploy toolchains match
        run: ruby scripts/check-toolchains.rb

      - name: Version check script
        run: scripts/check-version.sh ""
