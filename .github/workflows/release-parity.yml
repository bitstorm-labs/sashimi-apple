name: Release parity

# For HAND-PUSHED tags only. The Release workflow tags with GITHUB_TOKEN, which
# starts no workflows, so its releases never reach this check -- and it ships
# every selected platform anyway (all three by default).
#
# History: tvOS and iOS tags were once cut separately and the whole 1.3.x
# line reached tvOS testers and never iOS (#400). This still flags a hand-
# pushed tag whose counterpart never shows up, but as a WARNING: a
# single-platform re-release (e.g. ios-v1.6.36-beta2) is legitimate and must
# not leave a red run behind.

on:
  push:
    tags:
      - 'v*-beta*'
      - 'v*-rc*'
      - 'ios-v*-beta*'
      - 'ios-v*-rc*'

permissions:
  contents: read

jobs:
  counterpart-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the other platform's tag
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          case "$TAG" in
            ios-v*) other="${TAG#ios-}"; platform=tvOS ;;
            *) other="ios-$TAG"; platform=iOS ;;
          esac
          # Hand-pushed tags usually land seconds apart; allow 10 minutes.
          for _ in $(seq 1 20); do
            if git ls-remote --exit-code --tags "$REPO" "refs/tags/$other" >/dev/null; then
              echo "Found $other: this release ships on both platforms."
              exit 0
            fi
            sleep 30
          done
          echo "::warning title=$platform not released::$TAG was pushed but $other was not, so $platform testers will not get this build. Fine for a deliberate one-platform re-release; otherwise push $other (or use the Release workflow, which tags every platform)."
