name: Release parity

# A tvOS tag (v1.2.3-beta1) and its iOS tag (ios-v1.2.3-beta1) are cut
# separately, and nothing tied them together: the whole 1.3.x line reached
# tvOS testers and never iOS (#400). Either tag starts this check, which waits
# for the other platform's tag and fails, visibly, if it never arrives.
# Deploys are untouched: shipping one platform deliberately still works and
# just shows up here as a red run.

on:
  push:
    tags:
      - 'v*-beta*'
      - 'v*-rc*'
      - 'ios-v*-beta*'
      - 'ios-v*-rc*'

permissions:
  contents: read

jobs:
  counterpart-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the other platform's tag
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          case "$TAG" in
            ios-v*) other="${TAG#ios-}"; platform=tvOS ;;
            *) other="ios-$TAG"; platform=iOS ;;
          esac
          # Tags are usually pushed seconds apart; allow 15 minutes.
          for _ in $(seq 1 30); do
            if git ls-remote --exit-code --tags "$REPO" "refs/tags/$other" >/dev/null; then
              echo "Found $other: this release ships on both platforms."
              exit 0
            fi
            sleep 30
          done
          echo "::error title=$platform not released::$TAG was pushed but $other was not. $platform testers will not get this build. Push $other, or ignore this if the one-platform release was deliberate."
          exit 1
