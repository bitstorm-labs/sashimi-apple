name: Deploy

# tvOS -> TestFlight (or the App Store). Three ways in:
#   * the Release workflow calls it (workflow_call) -- the normal path;
#   * a hand-pushed vX.Y.Z-betaN / -rcN tag;
#   * Actions -> Deploy -> Run workflow (dry_run builds + signs, no upload).
# iOS ships from deploy-ios.yml only. (This workflow used to ALSO run the iOS
# lane, so every tvOS tag uploaded a second iOS build, made with this job's
# older Xcode.)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore
      dry_run:
        description: 'Dry run: build and sign, but do not upload'
        type: boolean
        default: false

  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        type: string
        required: true
      tag:
        description: 'Release tag (vX.Y.Z-betaN); MARKETING_VERSION must match it'
        type: string
        required: true
      notes:
        description: 'TestFlight notes; blank = generated from commits'
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
      environment:
        type: string
        default: 'testflight'

  push:
    tags:
      - 'v*-beta*'
      - 'v*-rc*'

permissions:
  contents: read

env:
  # TOOLCHAIN (tvOS): macos-15 + latest-stable (Xcode 26.x). App Store Connect
  # rejected a tvOS upload built with Xcode 27.0 ("Unsupported SDK or Xcode
  # version", 2026-09-17), so tvOS stays here until a GA Xcode 27 tvOS upload
  # is proven. ci.yml's "Build tvOS App" uses the SAME runner + selector --
  # keep them in step (scripts/check-toolchains.rb fails CI if they drift).
  XCODE_VERSION: 'latest-stable'

jobs:
  deploy:
    name: Deploy tvOS to ${{ inputs.environment || 'testflight' }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: macos-15
    environment: ${{ inputs.environment || 'testflight' }}
    timeout-minutes: 40
    env:
      # Tag being shipped: the Release workflow's, or the pushed/selected tag.
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      RELEASE_NOTES: ${{ inputs.notes }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      LANE: ${{ inputs.environment == 'appstore' && 'release' || 'beta' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0  # tags + history for the TestFlight notes

      - name: Check MARKETING_VERSION matches the tag
        run: scripts/check-version.sh "$RELEASE_TAG"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install tvOS Platform
        run: |
          # Always ensure the tvOS DEVICE platform is installed (idempotent).
          # A conditional grep on -showsdks matches the simulator SDK and wrongly
          # skips the download, but archiving for generic/platform=tvOS needs the
          # full device platform — so download unconditionally.
          for i in 1 2 3; do
            xcodebuild -downloadPlatform tvOS && break
            echo "Retry $i failed, waiting 10s..."
            sleep 10
          done

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          # Gemfile.lock resolves excon >= 1.7.1, which requires Ruby >= 3.3.
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install Fastlane
        run: bundle install

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY_CONTENT" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$APP_STORE_CONNECT_KEY_ID".p8

      - name: Install Certificates
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane tvos certificates

      - name: Deploy to TestFlight${{ inputs.dry_run && ' (dry run, no upload)' || '' }}
        if: env.LANE == 'beta'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane tvos beta dry_run:"$DRY_RUN"

      - name: Deploy to App Store
        if: env.LANE == 'release' && env.DRY_RUN != 'true'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane tvos release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sashimi-tvOS-build
          # gym's output_directory "./build" resolves from the project root
          # (the old fastlane/build/* paths matched nothing).
          path: |
            build/*.ipa
            build/*.dSYM.zip
          retention-days: 30
