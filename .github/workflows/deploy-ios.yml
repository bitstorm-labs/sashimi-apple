name: Deploy iOS

# iOS/iPad (SashimiMobile) -> TestFlight. Three ways in:
#   * the Release workflow calls it (workflow_call) -- the normal path;
#   * a hand-pushed ios-vX.Y.Z-betaN / -rcN tag;
#   * Actions -> Deploy iOS -> Run workflow (dry_run builds + signs, no upload).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
      dry_run:
        description: 'Dry run: build and sign, but do not upload'
        type: boolean
        default: false

  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        type: string
        required: true
      tag:
        description: 'Release tag (ios-vX.Y.Z-betaN); MARKETING_VERSION must match it'
        type: string
        required: true
      notes:
        description: 'TestFlight notes; blank = generated from commits'
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
      environment:
        type: string
        default: 'testflight'

  push:
    tags:
      - 'ios-v*-beta*'
      - 'ios-v*-rc*'

permissions:
  contents: read

env:
  # TOOLCHAIN (iOS + Mac): xcode-27 + latest-stable = the newest GA Xcode 27.
  # Never bare 'latest': it picked an Xcode beta and App Store Connect rejected
  # the upload ("Unsupported SDK or Xcode version"). ci.yml's "Build iOS App"
  # uses the SAME runner + selector (scripts/check-toolchains.rb enforces it).
  # xcode-27 is GitHub's Xcode 27 image, still a public preview --
  # actions/runner-images#14404.
  XCODE_VERSION: 'latest-stable'

jobs:
  deploy:
    name: Deploy iOS to ${{ inputs.environment || 'testflight' }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: xcode-27
    environment: ${{ inputs.environment || 'testflight' }}
    timeout-minutes: 40
    env:
      # Tag being shipped: the Release workflow's, or the pushed/selected tag.
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      RELEASE_NOTES: ${{ inputs.notes }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      LANE: ${{ inputs.environment == 'appstore' && 'release' || 'beta' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0  # tags + history for the TestFlight notes

      - name: Check MARKETING_VERSION matches the tag
        run: scripts/check-version.sh "$RELEASE_TAG"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install iOS Platform
        run: |
          # Ensure the iOS platform/SDK is installed for the selected Xcode (idempotent).
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "Retry $i failed, waiting 10s..."
            sleep 10
          done || echo "iOS platform already present — continuing"

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          # Gemfile.lock resolves excon >= 1.7.1, which requires Ruby >= 3.3.
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install Fastlane
        run: bundle install

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY_CONTENT" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$APP_STORE_CONNECT_KEY_ID".p8

      - name: Install Certificates
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane ios certificates

      - name: Deploy to TestFlight${{ inputs.dry_run && ' (dry run, no upload)' || '' }}
        if: env.LANE == 'beta'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane ios beta dry_run:"$DRY_RUN"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SashimiMobile-build
          # gym's output_directory "./build" resolves from the project root
          # (the old fastlane/build/* paths matched nothing).
          path: |
            build/*.ipa
            build/*.dSYM.zip
          retention-days: 30
