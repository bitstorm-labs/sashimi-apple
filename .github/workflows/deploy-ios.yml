name: Deploy iOS

on:
  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore

  # Auto-deploy to TestFlight on iOS release tags
  push:
    tags:
      - 'ios-v*-beta*'
      - 'ios-v*-rc*'

env:
  # 'latest' (not 'latest-stable'): the xcode-27 image only carries a beta
  # until 27.0 GA reaches it. TestFlight accepts beta-Xcode uploads; App
  # Store submission needs a GA iOS SDK.
  XCODE_VERSION: 'latest'

jobs:
  deploy:
    name: Deploy iOS to ${{ github.event.inputs.environment || 'testflight' }}
    # xcode-27 is GitHub's Xcode 27 image (macOS 27, iOS/tvOS 27 SDKs), still a
    # public preview -- see actions/runner-images#14404. macos-15 / macos-26 top
    # out at Xcode 26.x, which cannot compile against iOS 27 APIs.
    runs-on: xcode-27
    environment: ${{ github.event.inputs.environment || 'testflight' }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install iOS Platform
        run: |
          # Ensure the iOS platform/SDK is installed for the selected Xcode (idempotent).
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "Retry $i failed, waiting 10s..."
            sleep 10
          done || echo "iOS platform already present — continuing"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install Fastlane
        run: bundle install

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_KEY_CONTENT" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$APP_STORE_CONNECT_KEY_ID".p8

      - name: Install Certificates
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane ios certificates

      - name: Deploy to TestFlight
        if: github.event.inputs.environment == 'testflight' || contains(github.ref, 'beta') || contains(github.ref, 'rc')
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane ios beta

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SashimiMobile-build
          path: |
            fastlane/build/*.ipa
            fastlane/build/*.dSYM.zip
          retention-days: 30
